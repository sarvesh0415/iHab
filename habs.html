<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e8e8e4;
    --border-light: #f0f0ec;
    --text: #1a1a1a;
    --text-muted: #888;
    --text-light: #bbb;
    --accent: #1c9776;
    --accent-light: #eff4ff;
    --green: #16a34a;
    --green-light: #f0fdf4;
    --red: #dc2626;
    --yellow: #ca8a04;
    --ink: #1a1a1a;
    --ink-fg: #ffffff;
  }

  [data-theme="dark"] {
    --bg: #111110;
    --surface: #1c1c1a;
    --border: #2e2e2b;
    --border-light: #252523;
    --text: #e8e8e4;
    --text-muted: #666;
    --text-light: #444;
    --accent: #22c38e;
    --accent-light: #0d2118;
    --green: #22c55e;
    --green-light: #0d1f14;
    --red: #f87171;
    --yellow: #fbbf24;
    --ink: #e8e8e4;
    --ink-fg: #111110;
  }

  body {
    font-family: 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .container { max-width: 720px; margin: 0 auto; }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--text);
  }
  .header-left h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .header-left .date { font-size: 12px; color: var(--text-muted); font-family: monospace; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  .completion-badge {
    font-family: monospace;
    font-size: 13px;
    background: var(--ink);
    color: var(--ink-fg);
    padding: 4px 10px;
    border-radius: 3px;
    transition: background 0.25s, color 0.25s;
  }

  .theme-toggle {
    width: 36px;
    height: 36px;
    border: 1.5px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
    flex-shrink: 0;
  }
  .theme-toggle:hover {
    background: var(--border-light);
    transform: rotate(20deg);
  }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    width: fit-content;
  }
  .tab {
    padding: 7px 18px;
    font-size: 12px;
    font-family: monospace;
    letter-spacing: 0.5px;
    border: none;
    background: var(--surface);
    cursor: pointer;
    color: var(--text-muted);
    border-right: 1px solid var(--border);
    transition: all 0.15s;
  }
  .tab:last-child { border-right: none; }
  .tab.active { background: var(--ink); color: var(--ink-fg); }
  .tab:hover:not(.active) { background: var(--border-light); }

  .panel { display: none; }
  .panel.active { display: block; }

  .section-label {
    font-size: 10px;
    font-family: monospace;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .tasks-list { display: flex; flex-direction: column; gap: 1px; }

  .task-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 14px;
    cursor: pointer;
    transition: background 0.1s;
    user-select: none;
  }
  .task-item:hover { background: var(--border-light); }
  .task-item.done { background: var(--green-light); border-color: #bbf7d0; }
  .task-item.skipped { background: var(--surface); border-color: var(--border); opacity: 0.6; }

  .task-check {
    width: 18px; height: 18px;
    border: 1.5px solid var(--border);
    border-radius: 2px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .task-item.done .task-check {
    background: var(--green);
    border-color: var(--green);
  }
  .task-item.skipped .task-check {
    background: transparent;
    border-color: var(--yellow);
  }
  .task-check svg { display: none; }
  .task-item.done .task-check svg.check-icon { display: block; }
  .task-item.skipped .task-check svg.skip-icon { display: block; }

  .task-name {
    flex: 1;
    font-size: 14px;
  }
  .task-item.done .task-name {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .task-item.skipped .task-name {
    color: var(--yellow);
    font-style: italic;
  }

  .task-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .task-action-btn {
    width: 20px; height: 20px;
    border: none; background: none;
    color: var(--text-light);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    transition: opacity 0.1s;
    flex-shrink: 0;
  }
  .task-item:hover .task-action-btn { opacity: 1; }
  .task-action-btn.skip-btn:hover { color: var(--yellow); }
  .task-action-btn.delete-btn:hover { color: var(--red); }
  .task-item.skipped .skip-btn { opacity: 1; color: var(--yellow); }

  .add-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1.5px dashed var(--border);
    border-radius: 3px;
  }
  .add-row input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14px;
    font-family: inherit;
    background: transparent;
    color: var(--text);
  }
  .add-row input::placeholder { color: var(--text-light); }

  .add-btn {
    width: 28px; height: 28px;
    background: var(--ink);
    color: var(--ink-fg);
    border: none;
    border-radius: 3px;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, background 0.25s;
  }
  .add-btn:hover { opacity: 0.75; }

  .stats-bar {
    display: flex;
    gap: 16px;
    margin-top: 24px;
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }
  .stat { flex: 1; }
  .stat-val { font-size: 22px; font-weight: 700; font-family: monospace; }
  .stat-lbl { font-size: 10px; color: var(--text-muted); font-family: monospace; letter-spacing: 0.5px; margin-top: 2px; }

  .progress-wrap { margin-top: 16px; }
  .progress-bar-bg {
    height: 5px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 6px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .graph-section { margin-bottom: 32px; }
  .graph-section h2 { font-size: 14px; margin-bottom: 16px; font-weight: 600; }
  .chart-scroll { overflow-x: auto; padding-bottom: 8px; }

  canvas {
    width: 100%;
    display: block;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .rate-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    margin-top: 8px;
  }
  .rate-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 3px;
  }
  .rate-card-name { font-size: 13px; margin-bottom: 8px; }
  .rate-card-pct { font-size: 24px; font-weight: 700; font-family: monospace; }
  .rate-card-bar { height: 3px; background: var(--border); margin-top: 6px; border-radius: 2px; overflow: hidden; }
  .rate-card-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

  .overall-rate {
    background: var(--ink);
    color: var(--ink-fg);
    padding: 20px;
    border-radius: 3px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.25s, color 0.25s;
  }
  .overall-rate .label { font-size: 11px; font-family: monospace; letter-spacing: 1px; opacity: 0.6; }
  .overall-rate .value { font-size: 42px; font-weight: 700; font-family: monospace; }

  .heatmap-wrap {
    overflow-x: auto;
    padding-bottom: 10px;
    /* Custom thin scrollbar */
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .heatmap-wrap::-webkit-scrollbar {
    height: 4px;
  }
  .heatmap-wrap::-webkit-scrollbar-track {
    background: transparent;
  }
  .heatmap-wrap::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  .heatmap-wrap::-webkit-scrollbar-thumb:hover {
    background: var(--text-muted);
  }
  .heatmap-months {
    display: flex;
    margin-top: 6px;
    margin-left: 28px;
    font-size: 9px;
    font-family: monospace;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }
  .heatmap-body { display: flex; gap: 0; align-items: flex-start; }

  .heatmap-day-labels {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-right: 4px;
    margin-top: 1px;
  }
  .heatmap-day-labels span {
    font-size: 9px;
    font-family: monospace;
    color: var(--text-muted);
    height: 12px;
    line-height: 12px;
    width: 22px;
    text-align: right;
  }

  .heatmap-grid {
    display: flex;
    gap: 3px;
    flex-wrap: nowrap;
    align-items: flex-start;
  }
  .heatmap-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .heatmap-month-gap {
    width: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    align-self: stretch;
    padding: 1px 0;
  }
  .heatmap-month-gap::after {
    content: '';
    display: block;
    width: 1px;
    height: 100%;
    background: var(--border);
    margin: 0 auto;
  }
  .heatmap-cell {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    cursor: default;
    transition: opacity 0.1s;
    position: relative;
  }
  .heatmap-cell:hover { opacity: 0.75; }

  .heatmap-legend {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 10px;
    font-family: monospace;
    color: var(--text-muted);
  }
  .heatmap-legend-cell {
    width: 12px; height: 12px;
    border-radius: 1px;
  }

  .hm-0 { background: var(--border); }
  .hm-1 { background: #14532d; }
  .hm-2 { background: #16a34a; }
  .hm-3 { background: #4ade80; }
  .hm-4 { background: #bbf7d0; }
  .hm-skip { background: #fef08a; }
  .hm-future { background: transparent; border: 1px solid var(--border); }

  [data-theme="dark"] .hm-1 { background: #86efac; }
  [data-theme="dark"] .hm-2 { background: #22c55e; }
  [data-theme="dark"] .hm-3 { background: #15803d; }
  [data-theme="dark"] .hm-4 { background: #166534; }
  [data-theme="dark"] .hm-skip { background: #854d0e; }

  .empty-state {
    padding: 32px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-left">
      <h1>Daily Tracker</h1>
      <div class="date" id="headerDate"></div>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <div class="completion-badge" id="completionBadge">0 / 0</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('today')">TODAY</button>
    <button class="tab" onclick="switchTab('monthly')">MONTHLY</button>
    <button class="tab" onclick="switchTab('alltime')">ALL TIME</button>
    <button class="tab" onclick="switchTab('rates')">RATES</button>
    <button class="tab" onclick="switchTab('heatmap')">HEATMAP</button>
  </div>

  <div class="panel active" id="panel-today">
    <div class="section-label">Tasks</div>
    <div class="tasks-list" id="tasksList"></div>

    <div class="add-row">
      <input type="text" id="newTaskInput" placeholder="Add a task..." maxlength="60" />
      <button class="add-btn" onclick="addTask()">+</button>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <div class="stat-val" id="statDone">0</div>
        <div class="stat-lbl">DONE</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statLeft">0</div>
        <div class="stat-lbl">LEFT</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statSkipped">0</div>
        <div class="stat-lbl">SKIPPED</div>
      </div>
      <div class="stat">
        <div class="stat-val" id="statStreak">0</div>
        <div class="stat-lbl">STREAK</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="section-label">TODAY'S PROGRESS</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-monthly">
    <div class="graph-section">
      <div class="section-label">Last 30 Days — Tasks Completed</div>
      <canvas id="monthlyCanvas" height="200"></canvas>
    </div>
  </div>

  <div class="panel" id="panel-alltime">
    <div class="graph-section">
      <div class="section-label">All Time — Completed Habits Per Day (Day 1 = Start)</div>
      <div class="chart-scroll">
        <canvas id="allTimeCanvas" height="200"></canvas>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-rates">
    <div class="overall-rate">
      <div>
        <div class="label">OVERALL COMPLETION RATE</div>
        <div style="font-size:11px;opacity:0.4;margin-top:2px;font-family:monospace;">ALL TIME</div>
      </div>
      <div class="value" id="overallRate">—</div>
    </div>
    <div class="section-label">Per Task — All Time</div>
    <div class="rate-grid" id="rateGrid"></div>
  </div>

  <div class="panel" id="panel-heatmap">
    <div class="section-label">Activity Heatmap &mdash; Last 12 Months</div>
    <div class="heatmap-wrap">
      <div class="heatmap-body">
        <div class="heatmap-day-labels">
          <span></span>
          <span>MON</span>
          <span></span>
          <span>WED</span>
          <span></span>
          <span>FRI</span>
          <span></span>
        </div>
        <div class="heatmap-grid" id="heatmapGrid"></div>
      </div>
      <div class="heatmap-months" id="heatmapMonths"></div>
      <div class="heatmap-legend">
        <span>More</span>
        <div class="heatmap-legend-cell hm-0"></div>
        <div class="heatmap-legend-cell hm-1"></div>
        <div class="heatmap-legend-cell hm-2"></div>
        <div class="heatmap-legend-cell hm-3"></div>
        <div class="heatmap-legend-cell hm-4"></div>
        <span>Less</span>
        &nbsp;&nbsp;
      </div>
    </div>
  </div>

</div>

<script>
const key = k => localStorage.getItem(k);
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function normalizeTask(task) {
  if (typeof task === 'string') {
    return { name: task.trim() };
  }

  const name = (task && task.name ? task.name : '').trim();
  return { name };
}

function getData() {
  const base = load('tracker_data') || {
    tasks: [],
    history: {}
  };

  base.tasks = (base.tasks || []).map(normalizeTask).filter(task => task.name);
  base.history = base.history || {};
  delete base.snoozed;
  return base;
}

function saveData(d) { save('tracker_data', d); }

const today = todayStr();
let data = getData();

if (!data.history[today]) {
  data.history[today] = {};
  data.tasks.forEach(task => { data.history[today][task.name] = false; });
  saveData(data);
}

data.tasks.forEach(task => {
  if (!(task.name in data.history[today])) data.history[today][task.name] = false;
});
saveData(data);

document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-GB', {
  weekday:'long', day:'numeric', month:'long', year:'numeric'
});

function getTaskNames() {
  return data.tasks.map(task => task.name);
}

function renderTasks() {
  const list = document.getElementById('tasksList');
  list.innerHTML = '';
  const rec = data.history[today] || {};

  const sortedTasks = [...data.tasks].sort((a, b) => Number(rec[a.name] === true) - Number(rec[b.name] === true));
  sortedTasks.forEach(task => {
    const name = task.name;
    const state = rec[name];
    const isDone = state === true;
    const isSkip = state === 'skip';
    const item = document.createElement('div');
    item.className = 'task-item' + (isDone ? ' done' : isSkip ? ' skipped' : '');
    const escaped = name.replace(/'/g, "\\'");
    item.innerHTML = `
      <div class="task-check">
        <svg class="check-icon" width="11" height="9" viewBox="0 0 11 9" fill="none">
          <path d="M1 4L4 7.5L10 1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="skip-icon" width="10" height="10" viewBox="0 0 10 10" fill="none">
          <line x1="2" y1="5" x2="8" y2="5" stroke="#ca8a04" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="task-name">${name}</span>
      <button class="task-action-btn skip-btn" title="Skip day" onclick="skipTask(event,'${escaped}')">⏭︎</button>
      <button class="task-action-btn delete-btn" title="Delete task" onclick="deleteTask(event,'${escaped}')">×</button>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.closest('.task-action-btn')) return;
      toggleTask(name);
    });
    list.appendChild(item);
  });

  updateStats();
}

function toggleTask(name) {
  const cur = data.history[today][name];
  if (cur === 'skip') { data.history[today][name] = false; }
  else { data.history[today][name] = !cur; }
  saveData(data);
  renderTasks();
}

function skipTask(e, name) {
  e.stopPropagation();
  const cur = data.history[today][name];
  data.history[today][name] = cur === 'skip' ? false : 'skip';
  saveData(data);
  renderTasks();
}

function deleteTask(e, name) {
  e.stopPropagation();
  if (!confirm(`Remove "${name}" from all tracking?`)) return;
  data.tasks = data.tasks.filter(task => task.name !== name);
  Object.keys(data.history).forEach(d => { delete data.history[d][name]; });
  saveData(data);
  renderTasks();
}

function addTask() {
  const input = document.getElementById('newTaskInput');
  const name = input.value.trim();
  if (!name) return;
  if (getTaskNames().includes(name)) { input.value = ''; return; }
  data.tasks.push({ name });
  data.history[today][name] = false;
  saveData(data);
  input.value = '';
  renderTasks();
}

document.getElementById('newTaskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

function updateStats() {
  const rec = data.history[today] || {};
  const total = data.tasks.length;
  const done = data.tasks.filter(task => rec[task.name] === true).length;
  const skipped = data.tasks.filter(task => rec[task.name] === 'skip').length;
  const left = total - done - skipped;
  const countable = total - skipped;
  const pct = countable ? Math.round(done / countable * 100) : 0;

  document.getElementById('statDone').textContent = done;
  document.getElementById('statLeft').textContent = Math.max(0, left);
  document.getElementById('statSkipped').textContent = skipped;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('completionBadge').textContent = `${done} / ${countable}`;

  const sortedDays = Object.keys(data.history).sort().reverse();
  let streak = 0;
  for (const d of sortedDays) {
    if (d === today) continue;
    const r = data.history[d];
    const tasks = Object.keys(r);
    if (!tasks.length) break;
    const nonSkipped = tasks.filter(t => r[t] !== 'skip');
    if (!nonSkipped.length) { streak++; continue; }
    const allDone = nonSkipped.every(t => r[t] === true);
    if (allDone) streak++;
    else break;
  }
  document.getElementById('statStreak').textContent = streak;
}

function drawMonthly() {
  const canvas = document.getElementById('monthlyCanvas');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = 200 * window.devicePixelRatio;
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const W = canvas.offsetWidth, H = 200;

  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const s = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const label = String(d.getDate());
    const rec = data.history[s] || {};
    const pct = Object.values(rec).filter(v => v === true).length;
    days.push({ label: i % 5 === 0 ? label : '', pct, date: s });
  }

  drawBarChart(ctx, W, H, days, '', false, data.tasks.length);
}

function drawAllTime() {
  const canvas = document.getElementById('allTimeCanvas');
  const recordedDays = Object.keys(data.history).filter(date => date <= today).sort();
  const start = new Date(`${recordedDays[0] || today}T00:00:00`);
  const end = new Date(`${today}T00:00:00`);
  const days = [];

  for (let date = new Date(start), index = 1; date <= end; date.setDate(date.getDate() + 1), index++) {
    const dateString = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const record = data.history[dateString] || {};
    const completed = Object.values(record).filter(value => value === true).length;
    const isLabelDay = index === 1 || index % 10 === 0 || dateString === today;
    days.push({
      label: isLabelDay ? `Day ${index}` : '',
      pct: completed,
      date: dateString
    });
  }

  const chartWidth = Math.max(canvas.parentElement.clientWidth, days.length * 12);
  canvas.style.width = `${chartWidth}px`;
  canvas.width = chartWidth * window.devicePixelRatio;
  canvas.height = 200 * window.devicePixelRatio;
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  drawLineChart(ctx, chartWidth, 200, days, data.tasks.length);
}

function drawLineChart(ctx, W, H, days, taskCount) {
  const pad = { top: 16, bottom: 32, left: 36, right: 12 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;
  const maxVal = Math.max(taskCount, 1);
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const lineColor = isDark ? '#75c995' : '#168b5a';
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim();
  const labelColor = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim();
  const points = days.map((day, index) => ({
    x: pad.left + (days.length > 1 ? index / (days.length - 1) : 0.5) * chartW,
    y: pad.top + chartH - (day.pct / maxVal) * chartH,
    day
  }));

  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 1;
  ctx.fillStyle = labelColor;
  ctx.font = '9px monospace';
  ctx.textAlign = 'right';

  for (let i = 0; i <= 4; i++) {
    const y = pad.top + chartH - (i / 4) * chartH;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + chartW, y);
    ctx.stroke();
    ctx.fillText(String(Math.round(maxVal * i / 4)), pad.left - 5, y + 3);
  }

  if (!points.length) return;

  const gradient = ctx.createLinearGradient(0, pad.top, 0, pad.top + chartH);
  gradient.addColorStop(0, isDark ? 'rgba(117, 201, 149, 0.32)' : 'rgba(22, 139, 90, 0.24)');
  gradient.addColorStop(1, isDark ? 'rgba(117, 201, 149, 0.02)' : 'rgba(22, 139, 90, 0.02)');

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  points.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
  ctx.lineTo(points[points.length - 1].x, pad.top + chartH);
  ctx.lineTo(points[0].x, pad.top + chartH);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  points.slice(1).forEach(point => ctx.lineTo(point.x, point.y));
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  points.forEach((point, index) => {
    if (!point.day.label) return;
    ctx.fillStyle = labelColor;
    ctx.font = '9px monospace';
    ctx.textAlign = index === 0 ? 'left' : index === points.length - 1 ? 'right' : 'center';
    ctx.fillText(point.day.label, point.x, H - pad.bottom + 14);
  });

  const lastPoint = points[points.length - 1];
  ctx.beginPath();
  ctx.arc(lastPoint.x, lastPoint.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = lineColor;
  ctx.shadowColor = lineColor;
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawBarChart(ctx, W, H, days, unit, showPct, fixedMax) {
  const pad = { top: 16, bottom: 32, left: 36, right: 12 };
  const chartW = W - pad.left - pad.right;
  const chartH = H - pad.top - pad.bottom;
  const maxVal = showPct ? 100 : Math.max(fixedMax ?? Math.max(...days.map(d=>d.pct), 1), 1);

  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = '#e8e8e4';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + chartH - (i/4) * chartH;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + chartW, y);
    ctx.stroke();

    ctx.fillStyle = '#aaa';
    ctx.font = '9px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxVal * i/4) + unit, pad.left - 5, y + 3);
  }

  const barW = Math.max(4, chartW / days.length * 0.55);
  const gap = chartW / days.length;

  days.forEach((d, i) => {
    const barH = (d.pct / maxVal) * chartH;
    const x = pad.left + i * gap + gap/2 - barW/2;
    const y = pad.top + chartH - barH;

    const isToday = d.date === today;
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    ctx.fillStyle = isToday ? (isDark ? '#e8e8e4' : '#1a1a1a') : (d.pct === 0 ? (isDark ? '#2e2e2b' : '#e8e8e4') : '#2563eb');
    ctx.fillRect(x, y, barW, barH);

    if (d.label) {
      ctx.fillStyle = '#888';
      ctx.font = '9px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(d.label, x + barW/2, H - pad.bottom + 14);
    }
  });
}

function renderRates() {
  const rateGrid = document.getElementById('rateGrid');
  rateGrid.innerHTML = '';

  const allDays = Object.keys(data.history);
  if (!allDays.length) {
    rateGrid.innerHTML = '<div class="empty-state">No history yet. Complete some tasks first.</div>';
    return;
  }

  const taskRates = {};
  data.tasks.forEach(task => {
    const t = task.name;
    let total = 0, done = 0;
    allDays.forEach(d => {
      if (t in data.history[d] && data.history[d][t] !== 'skip') {
        total++;
        if (data.history[d][t] === true) done++;
      }
    });
    taskRates[t] = total ? Math.round(done/total*100) : 0;
  });

  let totalSlots = 0, doneSlots = 0;
  allDays.forEach(d => {
    const rec = data.history[d];
    Object.keys(rec).forEach(t => {
      if (rec[t] !== 'skip') { totalSlots++; if (rec[t] === true) doneSlots++; }
    });
  });
  const overall = totalSlots ? Math.round(doneSlots/totalSlots*100) : 0;
  document.getElementById('overallRate').textContent = overall + '%';

  data.tasks.forEach(task => {
    const t = task.name;
    const pct = taskRates[t];
    const card = document.createElement('div');
    card.className = 'rate-card';
    card.innerHTML = `
      <div class="rate-card-name">${t}</div>
      <div class="rate-card-pct">${pct}%</div>
      <div class="rate-card-bar"><div class="rate-card-bar-fill" style="width:${pct}%"></div></div>
    `;
    rateGrid.appendChild(card);
  });
}

function renderHeatmap() {
  const grid = document.getElementById('heatmapGrid');
  const monthsEl = document.getElementById('heatmapMonths');
  grid.innerHTML = '';
  monthsEl.innerHTML = '';

  const CELL = 12, GAP = 3, SEP = 10;
  const labelEntries = [];
    
  const now = new Date();
  const monthStarts = [];
  for (let i = 11; i >= 0; i--) {
    monthStarts.push(new Date(now.getFullYear(), now.getMonth() - i, 1));
  }

  monthStarts.forEach((monthFirst, mi) => {
    const yr  = monthFirst.getFullYear();
    const mo  = monthFirst.getMonth();
    const daysInMonth = new Date(yr, mo + 1, 0).getDate();
    const firstDOW    = monthFirst.getDay();
    const monthName   = monthFirst.toLocaleDateString('en-GB', { month: 'short' }).toUpperCase();

    if (mi > 0) {
      const sep = document.createElement('div');
      sep.className = 'heatmap-month-gap';
      grid.appendChild(sep);
      labelEntries.push({ text: '', width: SEP });
    }

    const numCols = Math.floor((firstDOW + daysInMonth - 1) / 7) + 1;

    for (let c = 0; c < numCols; c++) {
      const colEl = document.createElement('div');
      colEl.className = 'heatmap-col';

      for (let r = 0; r < 7; r++) {
        const pos    = c * 7 + r;
        const dayNum = pos - firstDOW + 1;

        const cellEl = document.createElement('div');
        cellEl.className = 'heatmap-cell';

        if (dayNum < 1 || dayNum > daysInMonth) {
          cellEl.style.visibility = 'hidden';
        } else {
          const d = new Date(yr, mo, dayNum);
          const s = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

          if (s > today) {
            cellEl.classList.add('hm-future');
          } else {
            const rec = data.history[s] || {};
            const tasks = Object.keys(rec);
            const allSkip   = tasks.length && tasks.every(t => rec[t] === 'skip');
            const countable = tasks.filter(t => rec[t] !== 'skip');
            const doneCount = countable.filter(t => rec[t] === true).length;
            const pct       = countable.length ? doneCount / countable.length : 0;

            const completed = tasks.filter(task => rec[task] === true);
            const dateLabel = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            const activity = completed.length ? `Completed:\n${completed.map(task => `- ${task}`).join('\n')}` : 'No habits completed';
            cellEl.title = `${dateLabel}\n${activity}`;

            if      (allSkip)     { cellEl.classList.add('hm-skip'); }
            else if (!tasks.length){ cellEl.classList.add('hm-0'); }
            else if (pct === 0)   { cellEl.classList.add('hm-0'); }
            else if (pct <= 0.25) { cellEl.classList.add('hm-1'); }
            else if (pct <= 0.5)  { cellEl.classList.add('hm-2'); }
            else if (pct <= 0.75) { cellEl.classList.add('hm-3'); }
            else                  { cellEl.classList.add('hm-4'); }
          }
        }

        colEl.appendChild(cellEl);
      }

      grid.appendChild(colEl);
      labelEntries.push({ text: c === 0 ? monthName : '', width: CELL + GAP });
    }
  });

  labelEntries.forEach(entry => {
    const span = document.createElement('span');
    span.style.width = entry.width + 'px';
    span.style.flexShrink = '0';
    span.style.display = 'inline-block';
    if (entry.text) span.textContent = entry.text;
    monthsEl.appendChild(span);
  });
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['today','monthly','alltime','rates','heatmap'][i] === name);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');

  if (name === 'monthly') { setTimeout(drawMonthly, 10); }
  if (name === 'alltime') { setTimeout(drawAllTime, 10); }
  if (name === 'rates') renderRates();
  if (name === 'heatmap') {
    renderHeatmap();
    // Scroll to the rightmost (most recent) position
    setTimeout(() => {
      const wrap = document.querySelector('.heatmap-wrap');
      if (wrap) wrap.scrollLeft = wrap.scrollWidth;
    }, 20);
  }
}

function updateThemeIcon(isDark) {
  const btn = document.getElementById('themeToggle');
  btn.querySelector('.icon-moon').style.display = isDark ? 'none' : 'block';
  btn.querySelector('.icon-sun').style.display = isDark ? 'block' : 'none';
}

(function initTheme() {
  const saved = localStorage.getItem('tracker_theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const isDark = saved ? saved === 'dark' : prefersDark;
  if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
  updateThemeIcon(isDark);
})();

document.getElementById('themeToggle').addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('tracker_theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('tracker_theme', 'dark');
  }
  updateThemeIcon(!isDark);
});

renderTasks();
